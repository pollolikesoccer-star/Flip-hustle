function sound(kind){try{if(kind==="cash"){cashAudio.currentTime=0;cashAudio.play().catch(()=>{});return}const A=window.AudioContext||window.webkitAudioContext;if(!window.ac)window.ac=new A();window.ac.resume();let t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type="sine";o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start();o.stop(t+.32)}catch(e){}}
function renderStats(){ $("cash").textContent=fmt(state.cash);$("level").textContent=state.level;$("xptext").textContent=state.xp+" XP";let need=state.level*100;$("xpfill").style.width=Math.min(100,state.xp/need*100)+"%";$("nextxp").textContent=Math.max(0,need-state.xp)+" XP to Level "+(state.level+1);$("invcount").textContent=state.inv.length+"/50"}
function gainXP(x){state.xp+=x;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;products.forEach(p=>p.stock+=2)}}

  };
  const src=exact[p.n]||('https://tse1.mm.bing.net/th?q='+encodeURIComponent(p.brand+' '+p.n+' exact product photo'));
  return `<div class="itemVisual"><img class="productImg" src="${src}" alt="${String(p.n).replace(/"/g,'&quot;')}" loading="eager" onerror="this.onerror=null;this.style.display='none';this.parentElement.classList.add('photoFailed');this.parentElement.setAttribute('aria-label','Photo unavailable')"></div>`;

function card(p){let sell=resale(p),profit=sell-p.buy,sold=p.stock<=0,remaining=sold&&p.restockAt?Math.max(0,Math.ceil((p.restockAt-Date.now())/1000)):0,mins=Math.floor(remaining/60),secs=String(remaining%60).padStart(2,'0'),can=state.cash>=p.buy&&!sold;let stockText=sold?`<span class="restockText">⏳ Restocking in ${mins}:${secs}</span>`:`Stock: ${p.stock}/${p.maxStock}`;return `<div class="card item" data-id="${p.id}"><div class="itemTop"><div class="itemVisualWrap">${visual(p)}</div><div class="itemInfo" style="flex:1"><h3>${p.n}</h3><div class="meta">${p.cat} • <span class="brandTag">${p.brand}</span> • ${stockText}</div></div><div class="itemPrice"><div class="money">${fmt(p.buy)}</div><div class="sellLine">Sell ${fmt(sell)} • <span class="profit">Profit +${fmt(profit)}</span></div></div></div><div class="purchaseRow"><div class="qty"><button class="minus" ${sold?"disabled":""}>−</button><input value="1" readonly><button class="plus" ${sold?"disabled":""}>+</button></div><button class="buy" ${can?"":"disabled"}>${sold?'Sold Out':'Buy'}</button></div></div>`}
function renderMarket(){let arr=products.filter(p=>(state.cat==="All"||p.cat===state.cat)&&(state.brand==="All"||p.brand===state.brand)&&p.n.toLowerCase().includes(state.q.toLowerCase()));$("marketGrid").innerHTML=arr.map(card).join("")||'<div class="empty">No items found.</div>'}
function renderInv(){let brands=["All Brands",...new Set(state.inv.map(x=>x.brand))];let sel=$("invbrand").value;if(!brands.includes(sel))sel="All Brands";$("invbrand").innerHTML=brands.map(x=>`<option>${x}</option>`).join("");$("invbrand").value=sel;let a=state.inv.filter(x=>sel==="All Brands"||x.brand===sel);$("inventoryList").innerHTML=a.length?a.map((x,i)=>`<div class="invrow"><div><b class="white">${x.n}</b><div class="meta">${x.ready?"Ready to sell":"📦 Shipping · "+Math.max(0,Math.ceil((x.readyAt-Date.now())/1000))+"s"}</div></div><div><div class="money">${fmt(resale(x))}</div><button data-sell="${i}" ${x.ready?"":"disabled"}>Sell</button></div></div>`).join(""):'<div class="empty">Inventory is empty.</div>'}
function render(){renderStats();$("cat").value=state.cat;$("search").value=state.q;renderMarket();renderInv();drawProfit(currentRange);save()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$(b.dataset.tab).classList.add("on");document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.tab==="inventory")renderInv()})
$("search").oninput=e=>{state.q=e.target.value;renderMarket();save()}
$("cat").onchange=e=>{state.cat=e.target.value;renderMarket()}
document.querySelectorAll("[data-brand]").forEach(b=>b.onclick=()=>{state.brand=b.dataset.brand;renderMarket()})
$("marketGrid").onclick=e=>{let c=e.target.closest(".item");if(!c)return;let p=products.find(x=>x.id==c.dataset.id);if(e.target.classList.contains("plus")){let i=c.querySelector("input");i.value=Math.min(p.stock,Number(i.value)+1)}if(e.target.classList.contains("minus")){let i=c.querySelector("input");i.value=Math.max(1,Number(i.value)-1)}if(e.target.classList.contains("buy")){let q=Number(c.querySelector("input").value);q=Math.min(q,p.stock);if(q*p.buy<=state.cash&&q>0){state.cash-=q*p.buy;p.stock-=q;if(p.stock===0)p.restockAt=Date.now()+300000;for(let j=0;j<q;j++)state.inv.push({n:p.n,buy:p.buy,brand:p.brand,img:p.img||null,ready:false,readyAt:Date.now()+30000,ding:false});gainXP(10*q);sound("cash");render()}}}
$("inventoryList").onclick=e=>{let i=e.target.dataset.sell;if(i==null)return;let x=state.inv[i];if(!x.ready)return;let sale=resale(x),profit=sale-x.buy;state.cash+=sale;addProfit(profit);gainXP(10);state.inv.splice(i,1);sound("cash");render()}
$("invbrand").onchange=()=>renderInv();
setInterval(()=>{let changed=false;products.forEach(p=>{if(p.stock<=0&&p.restockAt&&Date.now()>=p.restockAt){p.stock=p.maxStock;saveProductStock();p.restockAt=0;changed=true;sound("ding")}});state.inv.forEach(x=>{if(!x.ready&&Date.now()>=x.readyAt){x.ready=true;if(!x.ding){x.ding=true;sound("ding")}changed=true}});if(changed||document.getElementById("inventory").classList.contains("on"))render()},1000);

let currentRange="day";

$("profitBox").onclick=()=>{let p=$("profitPanel");p.style.display=p.style.display==="none"?"block":"none";if(p.style.display==="block")drawProfit(currentRange)};

  {n:"Rolex",img:"https://images.unsplash.com/photo-1524805444758-089113d48a6d"}
];matchCards=[...e,...e].sort(()=>Math.random()-.5);flipped=[];matched=0;$("match").innerHTML=matchCards.map((x,i)=>`<button class="matchCard" data-m="${i}" title="${x.n}"><img src="${x.img}" alt="${x.n}"><span style="position:absolute;inset:auto 0 0;background:#090909cc;font-size:9px;padding:3px">${x.n}</span></button>`).join("")}
$("match").onclick=e=>{let b=e.target.closest("[data-m]");if(!b||flipped.length>=2)return;let i=+b.dataset.m;b.classList.add("revealed");flipped.push(i);if(flipped.length===2){let [a,c]=flipped;if(matchCards[a].n===matchCards[c].n){matched++;document.querySelector(`[data-m="${a}"]`).classList.add("matched");document.querySelector(`[data-m="${c}"]`).classList.add("matched");flipped=[];if(matched===6){state.cash+=10;gainXP(10);sound("cash");renderStats();alert("Match win! +$10")}}else setTimeout(()=>{document.querySelectorAll("[data-m]").forEach(x=>x.classList.remove("revealed"));flipped=[]},500)}};

const MAP=['###########','#P..#.....#','#.#.#.###.#','#.#...#...#','#.###.#.#.#','#.....#.#.#','###.###.#.#','#...#...#.#','#.#.#.###.#','#.#......S#','###########'];
let sharkTimer=null,sharkTime=null,pos={x:1,y:1},shark={x:9,y:9};
function drawMaze(){let el=$("maze");el.className="maze";el.innerHTML=MAP.map((row,y)=>[...row].map((v,x)=>`<div class="cell ${v==="#"?"wall":""} ${x===pos.x&&y===pos.y?"player":""} ${x===shark.x&&y===shark.y?"shark":""}"></div>`).join("")).join("")}
function move(dx,dy){let nx=pos.x+dx,ny=pos.y+dy;if(MAP[ny]?.[nx]!=="#"){pos={x:nx,y:ny};drawMaze();if(pos.x===shark.x&&pos.y===shark.y)endShark(false)}}
function sharkStep(){
  // Chase the player using the shortest walkable path so the shark does not pace back and forth.
  const q=[[shark.x,shark.y,[]]],seen=new Set([shark.x+","+shark.y]);
  let path=null;
  while(q.length){
    const [x,y,moves]=q.shift();
    if(x===pos.x&&y===pos.y){path=moves;break}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,key=nx+","+ny;
      if(MAP[ny]?.[nx]!=="#"&&!seen.has(key)){seen.add(key);q.push([nx,ny,moves.concat([[dx,dy]])])}
    }
  }
  if(path&&path.length){const [dx,dy]=path[0];shark.x+=dx;shark.y+=dy}
  drawMaze();
  if(shark.x===pos.x&&shark.y===pos.y)endShark(false)
}
function endShark(win){clearInterval(sharkTimer);clearInterval(sharkTime);if(win){state.cash+=20;gainXP(20);$("sharkStatus").textContent="You survived! +$20";sound("cash")}else $("sharkStatus").textContent="Caught! $0";renderStats();save()}
function startShark(){clearInterval(sharkTimer);clearInterval(sharkTime);pos={x:1,y:1};shark={x:9,y:9};let left=20;$("sharkStatus").textContent="20s left";drawMaze();sharkTimer=setInterval(sharkStep,450);sharkTime=setInterval(()=>{left--; $("sharkStatus").textContent=left+"s left";if(left<=0)endShark(true)},1000)}
$("sharkStart").onclick=startShark;document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.move];move(...d)});document.addEventListener("keydown",e=>{if(!document.getElementById("mini").classList.contains("on"))return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}})
loadProductStock();
render();
</script></body></html>
