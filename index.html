<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flip Hustle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
#app{max-width:1100px;margin:auto;padding:14px;min-height:100vh}.logo{font-weight:900;font-size:28px;letter-spacing:1px}.sub{color:#aaa;font-size:12px}
.tabs{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap;background:#050505;padding:6px 0;z-index:5}.tabs button{min-width:0;flex:0 0 39%;min-height:58px;font-size:18px;border-radius:22px}
button,select,input{font:inherit}button{border:1px solid #8d42ff;background:#11071f;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}
button.active{background:#7d35e8}button:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.panel{border:1px solid #7d35e8;border-radius:15px;padding:12px;background:#080808}.label{font-size:11px;color:#fff;font-weight:800}.value{font-size:22px;font-weight:900;color:#42ff74}.white{color:#fff}.xpbar{height:8px;background:#222;border-radius:99px;overflow:hidden;margin:7px 0}.xpfill{height:100%;background:#7d35e8;width:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls input,.controls select{background:#0d0d0d;color:#fff;border:1px solid #5f2eb5;border-radius:10px;padding:10px;min-width:150px}
.grid{display:grid;grid-template-columns:1fr;gap:0;width:100%}.item{padding:18px 22px;border-radius:28px;margin:0 0 -1px}.itemTop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.itemVisual{width:112px;height:92px;flex:0 0 112px;border:1px solid #7d35e8;border-radius:18px;background:linear-gradient(145deg,#15101e,#080808);display:flex;align-items:center;justify-content:center;overflow:hidden}.itemVisual svg{width:100%;height:100%}.brandTag{display:inline-block;border:1px solid #7d35e8;border-radius:999px;padding:3px 8px;margin-left:5px;color:#fff;font-size:12px;font-weight:800}.itemInfo{min-width:0}.itemPrice{text-align:right;white-space:nowrap}.item h3{margin:0 0 7px;font-size:24px;line-height:1.15}.meta{font-size:16px;color:#aaa}.money{color:#42ff74;font-weight:900;font-size:22px}.profit{color:#42ff74;font-size:16px}.sellLine{font-size:16px;color:#fff;margin-top:3px}.buy{background:#20a94a;border-color:#20a94a;color:#fff;font-size:18px;padding:12px 24px;border-radius:15px}.qty{display:flex;gap:10px;align-items:center;margin:14px 0 0}.qty button{padding:10px 18px;font-size:22px;border-radius:13px}.qty input{width:70px;text-align:center;background:#111;border:1px solid #7d35e8;color:#fff;border-radius:13px;padding:11px;font-size:18px}.purchaseRow{display:flex;align-items:center;gap:10px}.invrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #222;padding:10px 0}.screen{display:none}.screen.on{display:block}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px}.chip{white-space:nowrap}.miniGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.maze{display:grid;grid-template-columns:repeat(11,24px);gap:2px;margin:12px auto;width:max-content}.cell{width:24px;height:24px;border-radius:4px;background:#151515}.wall{background:#702bd1}.player{background:#42ff74}.shark{background:#ff4d4d}.arrows{display:grid;grid-template-columns:repeat(3,52px);justify-content:center;gap:6px}.arrows button{height:46px}.empty{color:#999;padding:20px;text-align:center}
@media(max-width:650px){#app{padding:9px}.stats{grid-template-columns:repeat(2,1fr)}.item{padding:18px 14px;border-radius:24px}.item h3{font-size:20px}.meta{font-size:14px}.money{font-size:20px}.sellLine{font-size:14px}.tabs{gap:10px}.tabs button{flex:0 0 calc(50% - 5px);padding:10px 5px;font-size:16px;min-height:56px}.maze{transform:scale(.9);transform-origin:top center;margin-bottom:-20px}}
</style>
</head>
<body><main id="app">
<div class="logo">💸 FLIP HUSTLE</div><div class="sub">Buy • Flip • Profit</div>
<div class="tabs"><button data-tab="market" class="active">Marketplace</button><button data-tab="inventory">Inventory</button><button data-tab="mini">Mini-Games</button></div>

<section class="stats">
<div class="card"><div class="label">CASH</div><div id="cash" class="value">$150</div></div>
<div class="card"><div class="label">LEVEL</div><div id="level" class="value">1</div></div>
<div class="card"><div class="label">XP</div><div id="xptext" class="white">0 XP</div><div class="xpbar"><div id="xpfill" class="xpfill"></div></div><div id="nextxp" class="label">100 XP to Level 2</div></div>
<div class="card"><div class="label">INVENTORY</div><div id="invcount" class="white">0/50</div></div>
</section>

<section id="market" class="screen on">
<div class="panel" style="margin-top:10px">
<div class="controls"><input id="search" placeholder="Search items..."><select id="cat"><option>All</option><option>Fashion</option><option>Electronics</option><option>Transportation</option><option>Cheap</option></select><button id="refresh">↻ Refresh +1 Stock</button></div>
<div class="chips"><button class="chip" data-brand="All">All</button><button class="chip" data-brand="Nike">Nike</button><button class="chip" data-brand="Jordan">Jordan</button><button class="chip" data-brand="ESSENTIALS">ESSENTIALS</button><button class="chip" data-brand="Chrome Hearts">Chrome Hearts</button><button class="chip" data-brand="Balenciaga">Balenciaga</button><button class="chip" data-brand="Yeezy">Yeezy</button><button class="chip" data-brand="BAPE">BAPE</button></div>
<div id="marketGrid" class="grid"></div></div>
</section>

<section id="inventory" class="screen">
<div class="panel" style="margin-top:10px"><div class="controls"><select id="invbrand"><option>All Brands</option></select></div><div id="inventoryList"></div></div>
</section>

<section id="mini" class="screen">
<div class="miniGrid" style="margin-top:10px">
<div class="panel"><h3>🃏 Match Game</h3><p class="sub">Flip pairs. Win $10.</p><div id="match"></div><button id="matchStart">Start Match</button></div>
<div class="panel"><h3>🦈 Shark Tag</h3><p class="sub">Survive 20 seconds for $20.</p><div id="sharkStatus">Press Play.</div><div id="maze"></div><div class="arrows"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><button id="sharkStart">Play Shark Tag</button></div>
</div>
</section>
</main>
<script>
const regular=[
["Nike Air Force 1 07",115,"Fashion","Nike"],["Supreme Small Box Tee",64,"Fashion","Supreme"],["Adidas Campus 00s",110,"Fashion","Adidas"],
...Array.from({length:11},(_,i)=>[`Jordan ${i+1}`,[125,150,190,215,200,210,200,205,190,195,220][i],"Fashion","Jordan"]),
["Yeezy Slides",75,"Fashion","Yeezy"],["Yeezy Foam Runner",90,"Fashion","Yeezy"],["Yeezy 350 V2",220,"Fashion","Yeezy"],["Yeezy 500",240,"Fashion","Yeezy"],["Yeezy 700",300,"Fashion","Yeezy"],["Yeezy 700 V2",280,"Fashion","Yeezy"],["Yeezy 700 V3",260,"Fashion","Yeezy"],["Yeezy 450",210,"Fashion","Yeezy"],["Yeezy Knit Runner",250,"Fashion","Yeezy"],["Yeezy 500 High",260,"Fashion","Yeezy"],["Yeezy Desert Boot",275,"Fashion","Yeezy"],["Yeezy Powerphase",150,"Fashion","Yeezy"],
["Balenciaga Triple S",1150,"Fashion","Balenciaga"],["Balenciaga Track Sneaker",1200,"Fashion","Balenciaga"],["Balenciaga Runner Sneaker",1100,"Fashion","Balenciaga"],["Balenciaga Speed Trainer",950,"Fashion","Balenciaga"],["Balenciaga Logo Hoodie",850,"Fashion","Balenciaga"],["Balenciaga Logo Tee",500,"Fashion","Balenciaga"],["Balenciaga Cargo Pants",900,"Fashion","Balenciaga"],
["Chrome Hearts Horseshoe Hoodie",900,"Fashion","Chrome Hearts"],["Chrome Hearts Horseshoe Tee",600,"Fashion","Chrome Hearts"],["Chrome Hearts Cross Tee",650,"Fashion","Chrome Hearts"],["Chrome Hearts Logo Zip-Up Hoodie",1000,"Fashion","Chrome Hearts"],["Chrome Hearts Hat",450,"Fashion","Chrome Hearts"],["Chrome Hearts Sweatpants",850,"Fashion","Chrome Hearts"],
["ESSENTIALS Classic Tee",75,"Fashion","ESSENTIALS"],["ESSENTIALS Classic Hoodie",160,"Fashion","ESSENTIALS"],["ESSENTIALS Classic Sweatpant",140,"Fashion","ESSENTIALS"],["ESSENTIALS Classic Sweatshort",95,"Fashion","ESSENTIALS"],["ESSENTIALS Classic Zip-Up Hoodie",170,"Fashion","ESSENTIALS"],["ESSENTIALS Classic Trackpant",140,"Fashion","ESSENTIALS"],["ESSENTIALS Shell Bag",115,"Fashion","ESSENTIALS"],["ESSENTIALS Large Shell Bag",160,"Fashion","ESSENTIALS"],["ESSENTIALS 5 Panel Nylon Hat",55,"Fashion","ESSENTIALS"],["ESSENTIALS Classic Crewneck",140,"Fashion","ESSENTIALS"],["ESSENTIALS 1977 Tee",100,"Fashion","ESSENTIALS"],["ESSENTIALS NBA 90s Hoodie",165,"Fashion","ESSENTIALS"],["ESSENTIALS NBA Flare Sweatpant",150,"Fashion","ESSENTIALS"],["ESSENTIALS NBA Classic Basketball Short",150,"Fashion","ESSENTIALS"],["ESSENTIALS 90s Hoodie",185,"Fashion","ESSENTIALS"],
["BAPE Shark Hoodie",550,"Fashion","BAPE"],["BAPE STA #1",300,"Fashion","BAPE"],["BAPE STA OS #1",325,"Fashion","BAPE"],["BAPE STA OS #2",325,"Fashion","BAPE"],["BAPE STA Icon #1",325,"Fashion","BAPE"],["BAPE SK8 STA #2",325,"Fashion","BAPE"],["BAPE Slides #1",179,"Fashion","BAPE"],["BAPE Shark Full Zip Hoodie",449,"Fashion","BAPE"],["BAPE Camo Shark Hoodie",475,"Fashion","BAPE"],["BAPE Camo Tee",125,"Fashion","BAPE"],["BAPE Army Tee",125,"Fashion","BAPE"],["BAPE NYC Logo Tee",125,"Fashion","BAPE"],["BAPE College Tee",125,"Fashion","BAPE"],["BAPE Baby Milo Tee",129,"Fashion","BAPE"],["BAPE Big Ape Head Tee",125,"Fashion","BAPE"],["BAPE Logo Tee",125,"Fashion","BAPE"],["BAPE Camo Full Zip Hoodie",399,"Fashion","BAPE"],["BAPE Camo Cap",155,"Fashion","BAPE"],["BAPE Camo Shorts",280,"Fashion","BAPE"],
["AirPods 4",129,"Electronics","Apple"],["AirPods Pro 3",249,"Electronics","Apple"],["iPhone 17",799,"Electronics","Apple"],["iPhone 17 Pro",1099,"Electronics","Apple"],["Samsung Galaxy S26",799,"Electronics","Samsung"],["Google Pixel 10",799,"Electronics","Google"],["iPad Air",599,"Electronics","Apple"],["MacBook Air",999,"Electronics","Apple"],["PS5",549,"Electronics","Sony"],["Xbox Series X",599,"Electronics","Xbox"],["Nintendo Switch 2",449,"Electronics","Nintendo"],
["Tesla Model 3",38990,"Transportation","Tesla"],["Toyota Camry",28700,"Transportation","Toyota"],["Honda Civic",24700,"Transportation","Honda"],["Yamaha MT-07",8499,"Transportation","Yamaha"],["Tuttio Soleil",959,"Transportation","Tuttio"],["Segway Ninebot Scooter",799,"Transportation","Segway"],["RadRunner E-Bike",1999,"Transportation","Rad"],["Electric Skateboard",699,"Transportation","Electric"],["Bugatti Chiron",3000000,"Transportation","Bugatti"],["Ford Mustang",45000,"Transportation","Ford"],["Ford F-150",42000,"Transportation","Ford"],["Ford Explorer",38000,"Transportation","Ford"],["Chevrolet Camaro",32000,"Transportation","Chevrolet"],["Dodge Charger",40000,"Transportation","Dodge"],["Dodge Challenger",38000,"Transportation","Dodge"],["BMW M4",82000,"Transportation","BMW"],["Mercedes-Benz C-Class",58000,"Transportation","Mercedes-Benz"],["Audi R8",170000,"Transportation","Audi"],["Lamborghini Huracán",250000,"Transportation","Lamborghini"],["Porsche 911",120000,"Transportation","Porsche"]
];
const cheap=[["Nike Socks",8,"Cheap","Nike"],["Adidas Socks",10,"Cheap","Adidas"],["Nike Beanie",12,"Cheap","Nike"],["Vans T-Shirt",15,"Cheap","Vans"],["Champion Hoodie",22,"Cheap","Champion"],["Nike Backpack",25,"Cheap","Nike"],["Adidas Slides",18,"Cheap","Adidas"],["Crocs Classic Clog",28,"Cheap","Crocs"],["Phone Case",7,"Cheap","Generic"],["Wireless Earbuds",20,"Cheap","Generic"],["Used Nike Air Max",35,"Cheap","Nike"],["Used Jordan 1 Low",45,"Cheap","Jordan"],["Used Adidas Campus",38,"Cheap","Adidas"],["Used Supreme Tee",30,"Cheap","Supreme"],["Used AirPods",55,"Cheap","Apple"]];
const products=[...regular,...cheap].map((p,i)=>({id:i,n:p[0],buy:p[1],cat:p[2],brand:p[3],stock:5}));
let state={cash:150,level:1,xp:0,inv:[],brand:"All",cat:"All",q:""};
const $=id=>document.getElementById(id);
function fmt(n){return "$"+n.toLocaleString()}
function resale(p){return Math.max(p.buy+30,Math.round(p.buy*1.2))}
function save(){try{localStorage.setItem("flipHustle",JSON.stringify(state))}catch(e){}}
try{let s=JSON.parse(localStorage.getItem("flipHustle"));if(s)state=s}catch(e){}
function sound(kind){try{const A=window.AudioContext||window.webkitAudioContext;if(!window.ac)window.ac=new A();window.ac.resume();let t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);if(kind==="cash"){o.type="square";o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(1400,t+.08);o.frequency.exponentialRampToValueAtTime(1050,t+.18)}else{o.frequency.value=880}g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start();o.stop(t+.3)}catch(e){}}
function renderStats(){ $("cash").textContent=fmt(state.cash);$("level").textContent=state.level;$("xptext").textContent=state.xp+" XP";let need=state.level*100;$("xpfill").style.width=Math.min(100,state.xp/need*100)+"%";$("nextxp").textContent=Math.max(0,need-state.xp)+" XP to Level "+(state.level+1);$("invcount").textContent=state.inv.length+"/50"}
function gainXP(x){state.xp+=x;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;products.forEach(p=>p.stock+=2)}}
function visual(p){let type=p.cat==="Fashion"?((/tee|hoodie|sweat|jacket|shirt|crewneck|pant|short|hat|bag|beanie|sock/i.test(p.n))?"clothes":"shoe"):p.cat==="Electronics"?"tech":p.cat==="Transportation"?"car":"cheap";let icon=type==="shoe"?`<path d="M16 61c10-7 22-3 34-2 12 1 24 0 33-5 5-3 10 0 13 5l3 7H12c-3-2-1-4 4-5Z" fill="#eee"/><path d="M42 47c5 5 10 9 18 11" stroke="#7d35e8" stroke-width="5" fill="none"/><path d="M25 57h41" stroke="#111" stroke-width="4"/>`:type==="clothes"?`<path d="M37 18l11 7 11-7 17 13-9 12-7-6v30H28V37l-7 6-9-12 17-13Z" fill="#eee"/><path d="M37 18c2 9 20 9 22 0" stroke="#7d35e8" stroke-width="4" fill="none"/>`:type==="tech"?`<rect x="34" y="10" width="44" height="72" rx="8" fill="#eee"/><rect x="38" y="17" width="36" height="54" rx="5" fill="#151515"/><circle cx="56" cy="76" r="2.5" fill="#7d35e8"/>`:type==="car"?`<path d="M15 60l8-24c2-6 7-10 14-10h25c7 0 12 4 15 10l8 24H15Z" fill="#eee"/><circle cx="31" cy="61" r="8" fill="#151515" stroke="#7d35e8" stroke-width="4"/><circle cx="69" cy="61" r="8" fill="#151515" stroke="#7d35e8" stroke-width="4"/><path d="M30 35h39" stroke="#7d35e8" stroke-width="4"/>`:type==="cheap"?`<circle cx="56" cy="46" r="28" fill="#eee"/><path d="M44 46h24M56 34v24" stroke="#7d35e8" stroke-width="5"/>`:"";return `<div class="itemVisual"><svg viewBox="0 0 112 92" aria-label="${type} product illustration" role="img"><rect width="112" height="92" fill="#0b0b0b"/>${icon}<text x="56" y="87" text-anchor="middle" fill="#42ff74" font-size="9" font-weight="800">${String(p.brand).toUpperCase()}</text></svg></div>`}
function card(p){let sell=resale(p),profit=sell-p.buy,can=state.cash>=p.buy&&p.stock>0;return `<div class="card item" data-id="${p.id}"><div class="itemTop"><div class="itemVisualWrap">${visual(p)}</div><div class="itemInfo" style="flex:1"><h3>${p.n}</h3><div class="meta">${p.cat} • <span class="brandTag">${p.brand}</span> • Stock: ${p.stock}</div></div><div class="itemPrice"><div class="money">${fmt(p.buy)}</div><div class="sellLine">Sell ${fmt(sell)} • <span class="profit">Profit +${fmt(profit)}</span></div></div></div><div class="purchaseRow"><div class="qty"><button class="minus">−</button><input value="1" readonly><button class="plus">+</button></div><button class="buy" ${can?"":"disabled"}>Buy</button></div></div>`}
function renderMarket(){let arr=products.filter(p=>(state.cat==="All"||p.cat===state.cat)&&(state.brand==="All"||p.brand===state.brand)&&p.n.toLowerCase().includes(state.q.toLowerCase()));$("marketGrid").innerHTML=arr.map(card).join("")||'<div class="empty">No items found.</div>'}
function renderInv(){let brands=["All Brands",...new Set(state.inv.map(x=>x.brand))];let sel=$("invbrand").value;if(!brands.includes(sel))sel="All Brands";$("invbrand").innerHTML=brands.map(x=>`<option>${x}</option>`).join("");$("invbrand").value=sel;let a=state.inv.filter(x=>sel==="All Brands"||x.brand===sel);$("inventoryList").innerHTML=a.length?a.map((x,i)=>`<div class="invrow"><div><b class="white">${x.n}</b><div class="meta">${x.ready?"Ready to sell":"📦 Shipping · "+Math.max(0,Math.ceil((x.readyAt-Date.now())/1000))+"s"}</div></div><div><div class="money">${fmt(resale(x))}</div><button data-sell="${i}" ${x.ready?"":"disabled"}>Sell</button></div></div>`).join(""):'<div class="empty">Inventory is empty.</div>'}
function render(){renderStats();renderMarket();renderInv();save()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));$(b.dataset.tab).classList.add("on");document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(b.dataset.tab==="inventory")renderInv()})
$("search").oninput=e=>{state.q=e.target.value;renderMarket();save()}
$("cat").onchange=e=>{state.cat=e.target.value;renderMarket()}
document.querySelectorAll("[data-brand]").forEach(b=>b.onclick=()=>{state.brand=b.dataset.brand;renderMarket()})
$("refresh").onclick=()=>{products.forEach(p=>p.stock++);renderMarket();sound("ding")}
$("marketGrid").onclick=e=>{let c=e.target.closest(".item");if(!c)return;let p=products.find(x=>x.id==c.dataset.id);if(e.target.classList.contains("plus")){let i=c.querySelector("input");i.value=Math.min(p.stock,Number(i.value)+1)}if(e.target.classList.contains("minus")){let i=c.querySelector("input");i.value=Math.max(1,Number(i.value)-1)}if(e.target.classList.contains("buy")){let q=Number(c.querySelector("input").value);q=Math.min(q,p.stock);if(q*p.buy<=state.cash&&q>0){state.cash-=q*p.buy;p.stock-=q;for(let j=0;j<q;j++)state.inv.push({n:p.n,buy:p.buy,brand:p.brand,ready:false,readyAt:Date.now()+30000,ding:false});gainXP(10*q);sound("cash");render()}}})
$("inventoryList").onclick=e=>{let i=e.target.dataset.sell;if(i==null)return;let x=state.inv[i];if(!x.ready)return;state.cash+=resale(x);gainXP(10);state.inv.splice(i,1);sound("cash");render()}
$("invbrand").onchange=()=>renderInv();
setInterval(()=>{let changed=false;state.inv.forEach(x=>{if(!x.ready&&Date.now()>=x.readyAt){x.ready=true;if(!x.ding){x.ding=true;sound("ding")}changed=true}});if(changed||document.getElementById("inventory").classList.contains("on"))renderInv()},500);

let matchCards=[],flipped=[],matched=0;
$("matchStart").onclick=()=>{let e=["👟","📱","🎮","🧢","⌚","💻"];matchCards=[...e,...e].sort(()=>Math.random()-.5);flipped=[];matched=0;$("match").innerHTML=matchCards.map((_,i)=>`<button data-m="${i}" style="width:54px;margin:3px">❓</button>`).join("")}
$("match").onclick=e=>{let b=e.target.closest("[data-m]");if(!b||flipped.length>=2)return;let i=+b.dataset.m;b.textContent=matchCards[i];flipped.push(i);if(flipped.length===2){let [a,c]=flipped;if(matchCards[a]===matchCards[c]){matched++;flipped=[];if(matched===6){state.cash+=10;gainXP(10);sound("cash");renderStats();alert("Match win! +$10")}}else setTimeout(()=>{document.querySelectorAll("[data-m]").forEach(x=>{x.textContent="❓"});flipped=[]},500)}};

const MAP=['###########','#P..#.....#','#.#.#.###.#','#.#...#...#','#.###.#.#.#','#.....#.#.#','###.###.#.#','#...#...#.#','#.#.#.###.#','#.#......S#','###########'];
let sharkTimer=null,sharkTime=null,pos={x:1,y:1},shark={x:9,y:9};
function drawMaze(){let el=$("maze");el.className="maze";el.innerHTML=MAP.map((row,y)=>[...row].map((v,x)=>`<div class="cell ${v==="#"?"wall":""} ${x===pos.x&&y===pos.y?"player":""} ${x===shark.x&&y===shark.y?"shark":""}"></div>`).join("")).join("")}
function move(dx,dy){let nx=pos.x+dx,ny=pos.y+dy;if(MAP[ny]?.[nx]!=="#"){pos={x:nx,y:ny};drawMaze();if(pos.x===shark.x&&pos.y===shark.y)endShark(false)}}
function sharkStep(){let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>MAP[shark.y+dy]?.[shark.x+dx]!=="#");opts.sort((a,b)=>Math.abs(pos.x-(shark.x+b[0]))+Math.abs(pos.y-(shark.y+b[1]))-(Math.abs(pos.x-(shark.x+a[0]))+Math.abs(pos.y-(shark.y+a[1]))));let [dx,dy]=opts[0]||[0,0];shark.x+=dx;shark.y+=dy;drawMaze();if(shark.x===pos.x&&shark.y===pos.y)endShark(false)}
function endShark(win){clearInterval(sharkTimer);clearInterval(sharkTime);if(win){state.cash+=20;gainXP(20);$("sharkStatus").textContent="You survived! +$20";sound("cash")}else $("sharkStatus").textContent="Caught! $0";renderStats();save()}
function startShark(){clearInterval(sharkTimer);clearInterval(sharkTime);pos={x:1,y:1};shark={x:9,y:9};let left=20;$("sharkStatus").textContent="20s left";drawMaze();sharkTimer=setInterval(sharkStep,450);sharkTime=setInterval(()=>{left--; $("sharkStatus").textContent=left+"s left";if(left<=0)endShark(true)},1000)}
$("sharkStart").onclick=startShark;document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.move];move(...d)});document.addEventListener("keydown",e=>{if(!document.getElementById("mini").classList.contains("on"))return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}})
render();
</script></body></html>
render();
